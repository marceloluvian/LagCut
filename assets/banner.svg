<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="100%" role="img" aria-label="LagCut - competitive network control HUD">
  <defs>
    <radialGradient id="c-bg" cx="0.32" cy="0.4" r="0.95">
      <stop offset="0" stop-color="#141b31"/>
      <stop offset="0.6" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#070a15"/>
    </radialGradient>
    <linearGradient id="c-mag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a8f"/>
      <stop offset="1" stop-color="#ff2f6d"/>
    </linearGradient>
    <pattern id="c-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#26314f"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1280" height="340" fill="url(#c-bg)"/>
  <rect x="0" y="0" width="1280" height="340" fill="url(#c-grid)" opacity="0.5"/>

  <!-- HUD corner brackets -->
  <g stroke="#ff2f6d" stroke-width="3" fill="none" opacity="0.9">
    <path d="M40 68 V40 H92"/>
    <path d="M1240 68 V40 H1188"/>
    <path d="M40 272 V300 H92"/>
    <path d="M1240 272 V300 H1188"/>
  </g>

  <!-- flow chevrons -->
  <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 146 L98 170 L74 194" stroke="#ff2f6d"/>
    <path d="M108 146 L132 170 L108 194" stroke="#ff2f6d" opacity="0.6"/>
    <path d="M142 146 L166 170 L142 194" stroke="#ffd23f" opacity="0.85"/>
  </g>

  <!-- eyebrow -->
  <text x="216" y="86" font-family="ui-monospace,Consolas,monospace" font-size="17" letter-spacing="4" fill="#ffd23f">// COMPETITIVE NET CONTROL</text>

  <!-- wordmark -->
  <text x="212" y="196" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-style="italic" font-weight="800" font-size="112" letter-spacing="-2" fill="#eaf0ff">Lag<tspan fill="#ff2f6d">Cut</tspan></text>

  <!-- tagline -->
  <text x="218" y="244" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-weight="700" font-size="27" letter-spacing="4" fill="#ff5a8f">BANDWIDTH IS A WEAPON.</text>

  <!-- status segments -->
  <g>
    <rect x="218" y="266" width="30" height="12" rx="2" fill="#ffd23f"/>
    <rect x="254" y="266" width="30" height="12" rx="2" fill="#ffd23f"/>
    <rect x="290" y="266" width="30" height="12" rx="2" fill="#ffd23f"/>
    <rect x="326" y="266" width="30" height="12" rx="2" fill="#ff2f6d"/>
    <rect x="362" y="266" width="30" height="12" rx="2" fill="#2a3654"/>
    <text x="404" y="277" font-family="ui-monospace,Consolas,monospace" font-size="16" letter-spacing="2" fill="#8fa0c4">BACKGROUND TRAFFIC LOCKED</text>
  </g>

  <!-- HUD reticle -->
  <g>
    <polygon points="1172,170 1126,249.7 1034,249.7 988,170 1034,90.3 1126,90.3" fill="#101830" stroke="#ff2f6d" stroke-width="2.5"/>
    <polygon points="1158,170 1119,237.5 1041,237.5 1002,170 1041,102.5 1119,102.5" fill="none" stroke="#2f4066" stroke-width="1.5"/>
    <text x="1080" y="132" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3" fill="#8fa0c4">TRAFFIC</text>
    <text x="1080" y="186" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-weight="800" font-size="46" letter-spacing="2" fill="#ffd23f">CLEAR</text>
    <text x="1080" y="222" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3" fill="#4ee39a">LANE OPEN</text>
  </g>
</svg>
